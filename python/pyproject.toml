[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openroll"
version = "0.1.0"
description = "OpenRoll — the definitive framework-agnostic open standard for recording RL rollouts and agent trajectories. Adapters for HuggingFace TRL, OpenRLHF, verl, NVIDIA NeMo-RL, AReaL, slime, RLlib, TorchRL, Stable-Baselines3, Tianshou, CleanRL, Acme, Brax, PufferLib, Minari."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Agent Labs" }]
keywords = [
    "reinforcement-learning",
    "rl",
    "llm",
    "rollout",
    "trajectory",
    "agent",
    "agentic",
    "tool-use",
    "coding-model",
    "rlhf",
    "rlvr",
    "ppo",
    "grpo",
    "rloo",
    "dpo",
    "openroll",
    "trl",
    "openrlhf",
    "verl",
    "nemo-rl",
    "areal",
    "rllib",
    "torchrl",
    "stable-baselines3",
    "tianshou",
    "cleanrl",
    "minari",
    "interchange-format",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]
parquet = ["pyarrow>=14.0"]
hf = ["datasets>=2.14"]
all = [
    "jsonschema>=4.18",
    "pyarrow>=14.0",
    "datasets>=2.14",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.18",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/open-agent-labs-ai/OpenRoll"
Specification = "https://github.com/open-agent-labs-ai/OpenRoll/blob/main/SPECIFICATION.md"
Issues = "https://github.com/open-agent-labs-ai/OpenRoll/issues"

[project.scripts]
openroll = "openroll.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openroll"]

[tool.hatch.build.targets.wheel.force-include]
"../schema/openroll-v0.1.0.schema.json" = "openroll/schema/openroll-v0.1.0.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
